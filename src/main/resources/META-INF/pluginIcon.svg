<!-- Plugin icon: the @Preview annotation, forbidden.
     "@P" is traced from JetBrains Mono Bold (SIL Open Font License 1.1), the typeface the IDE uses in the
     editor, so it echoes the @Preview annotation the plugin hides - the same idea as the toolbar toggle icon.
     The sign follows ISO 7010 proportions: a red annulus, a white field and a 45 degree bar descending to the
     right. The bar is drawn twice, once in white and once in red, so it keeps a clean relief where it crosses
     the glyph instead of swallowing it.
     The icon carries its own white field, so it reads on both light and dark themes and needs no _dark variant. -->
