<!-- Plugin icon: the two things the plugin hides, forbidden.
     "@P" and "/*" are traced from JetBrains Mono Bold (SIL Open Font License 1.1), the typeface the IDE uses
     in the editor, so each one echoes the syntax of the filter it stands for, exactly like the two toolbar
     icons. The sign follows ISO 7010 proportions: a red annulus, a white field and a 45 degree bar descending
     to the right. The bar splits the field in two halves, which is what gives each filter its own side and
     keeps the sign readable: "@P" sits in the upper right half, "/*" in the lower left one.
     The glyph size is the largest that keeps both runs clear of the bar and of the annulus.
     The icon carries its own white field, so it reads on both light and dark themes and needs no _dark variant. -->
